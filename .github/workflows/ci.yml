name: 自动测试与示例管线

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装项目
        run: python -m pip install -e .
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v
      - name: 运行示例管线并生成仪表板
        run: sensor-analytics all
